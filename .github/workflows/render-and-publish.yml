name: Render and publish

# Fired by the Approve button in the dashboard, via repository_dispatch.
# This is where FFmpeg runs — GitHub's runners have it preinstalled and give
# free minutes, which is what keeps the whole pipeline at zero cost.
on:
  repository_dispatch:
    types: [render-video]
  workflow_dispatch:
    inputs:
      video_id:
        description: "spiritual_videos.id to render and publish"
        required: true
        type: string

# Never render the same item twice concurrently.
concurrency:
  group: render-${{ github.event.client_payload.video_id || inputs.video_id }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Before anything is checked out or installed. A runner without these
      # cannot render, cannot report, and cannot even say which one it was
      # missing — the row simply keeps the "rendering" that approval set. One
      # second of shell here turns that dead end into a named secret.
      - name: Check the required secrets are set
        env:
          VIDEO_ID: ${{ github.event.client_payload.video_id || inputs.video_id }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUBLISH_CALLBACK_SECRET: ${{ secrets.PUBLISH_CALLBACK_SECRET }}
        run: |
          if [ -z "$VIDEO_ID" ]; then
            echo "::error::No video_id was dispatched, so there is nothing to render."
            exit 1
          fi
          missing=""
          for name in NEXT_PUBLIC_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing — add them under" \
                 "Settings → Secrets and variables → Actions, then approve the video again."
            exit 1
          fi
          # Not fatal: the script reports progress by callback when this is set
          # and writes to the database directly when it is not. Worth saying out
          # loud, though, since without it the dashboard only updates at the end.
          if [ -z "$PUBLISH_CALLBACK_SECRET" ]; then
            echo "::warning::PUBLISH_CALLBACK_SECRET is not set, so this run cannot report" \
                 "progress back to the dashboard. Rendering will still work."
          fi
          echo "Rendering $VIDEO_ID; the required secrets are present."

      - name: Check out the repository
        uses: actions/checkout@v4

      # 22, not 20: supabase-js reaches for a global WebSocket the moment a
      # client is constructed, and Node 20 has none — createClient throws
      # before a single query is sent.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The narration is Telugu and the runner ships DejaVu, which has no
      # Indic glyphs whatsoever. Without this the captions burn in as a row of
      # empty boxes, and nothing in the render fails to say so.
      #
      # There is no "fonts-noto-telugu" package on Ubuntu, which is what this
      # step used to ask for: apt exited 100 with "unable to locate package"
      # and every approved video died here, seventeen seconds in, before
      # FFmpeg was even reached. The Telugu Noto face ships inside
      # fonts-noto-core. The names have moved between releases before, so ask
      # for the candidates in order rather than betting the run on one, and
      # let fc-list — not apt's exit code — decide whether we actually got a
      # Telugu font.
      - name: Install the Telugu caption font
        run: |
          sudo apt-get update -qq || sudo apt-get update -qq
          sudo apt-get install -y -qq fontconfig
          for pkg in fonts-noto-core fonts-noto fonts-telu fonts-lohit-telu; do
            sudo apt-get install -y -qq "$pkg" && echo "installed $pkg" || echo "no $pkg on this release, trying the next"
          done
          fc-cache -f
          if ! fc-list | grep -qi "noto sans telugu"; then
            echo "::error::No Telugu font was installed, so the captions would burn in as empty boxes. Check which package carries Noto Sans Telugu on this runner image."
            fc-list | grep -i telugu || echo "(no Telugu family at all)"
            exit 1
          fi
          fc-list | grep -i telugu | head -n 5

      - name: Confirm FFmpeg is available
        run: |
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Render and upload to YouTube
        env:
          VIDEO_ID: ${{ github.event.client_payload.video_id || inputs.video_id }}
          CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Optional, and unset until the service key is rotated — but it must
          # match the deployment once it exists. The settings key is derived
          # from it when present, so a runner without it would decrypt every
          # stored credential to null and report YouTube as disconnected.
          SETTINGS_MASTER_KEY: ${{ secrets.SETTINGS_MASTER_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: ${{ vars.YOUTUBE_PRIVACY_STATUS || 'public' }}
          YOUTUBE_CATEGORY_ID: ${{ vars.YOUTUBE_CATEGORY_ID || '22' }}
          PUBLISH_CALLBACK_SECRET: ${{ secrets.PUBLISH_CALLBACK_SECRET }}
        # Same reason as the seeder: job logs need admin rights on this
        # repository, annotations do not. Without this a crash inside the render
        # reaches anyone watching as "Process completed with exit code 1" and
        # nothing else, which is two runs spent learning nothing.
        run: |
          set -o pipefail
          if ! npx tsx scripts/render-and-publish.ts --id="$VIDEO_ID" 2>&1 | tee /tmp/render.log; then
            echo "::error::render failed: $(tail -c 900 /tmp/render.log | tr -s '[:space:]' ' ')"
            exit 1
          fi

      # Approval sets the row to "rendering" and the render script is what
      # normally moves it off that. Anything that dies before the script starts
      # — a missing apt package, a bad npm ci, a runner that vanishes — leaves
      # the row on "rendering" forever, and the queue shows no Retry for that
      # status, so the only way out was the SQL editor. Mark it failed with the
      # step that broke, so the dashboard offers Retry like any other failure.
      - name: Report the failure back to the dashboard
        if: failure()
        env:
          VIDEO_ID: ${{ github.event.client_payload.video_id || inputs.video_id }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SERVICE_KEY" ] || [ -z "$VIDEO_ID" ]; then
            echo "Nothing to report to: the URL, key or video id is missing."
            exit 0
          fi
          url="$SUPABASE_URL/rest/v1/spiritual_videos?id=eq.$VIDEO_ID&status=eq.rendering"
          # status=eq.rendering, so a run that already reported a real reason
          # of its own is never overwritten by this blunter one.
          body=$(jq -n --arg m "The render workflow failed on GitHub Actions. See $RUN_URL" '{status:"failed",error_message:$m}')
          code=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH "$url" -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" -H "Content-Type: application/json" -H "Prefer: return=minimal" -d "$body")
          echo "Supabase answered HTTP $code when marking $VIDEO_ID failed."

      - name: Keep the rendered file for inspection when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: render-debug-${{ github.event.client_payload.video_id || inputs.video_id }}
          path: tmp-render/
          retention-days: 3
          if-no-files-found: ignore
