name: Render and publish

# Fired by the Approve button in the dashboard, via repository_dispatch.
# This is where FFmpeg runs — GitHub's runners have it preinstalled and give
# free minutes, which is what keeps the whole pipeline at zero cost.
on:
  repository_dispatch:
    types: [render-video]
  workflow_dispatch:
    inputs:
      video_id:
        description: "spiritual_videos.id to render and publish"
        required: true
        type: string

# Never render the same item twice concurrently.
concurrency:
  group: render-${{ github.event.client_payload.video_id || inputs.video_id }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Before anything is checked out or installed. A runner without these
      # cannot render, cannot report, and cannot even say which one it was
      # missing — the row simply keeps the "rendering" that approval set. One
      # second of shell here turns that dead end into a named secret.
      - name: Check the required secrets are set
        env:
          VIDEO_ID: ${{ github.event.client_payload.video_id || inputs.video_id }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUBLISH_CALLBACK_SECRET: ${{ secrets.PUBLISH_CALLBACK_SECRET }}
        run: |
          if [ -z "$VIDEO_ID" ]; then
            echo "::error::No video_id was dispatched, so there is nothing to render."
            exit 1
          fi
          missing=""
          for name in NEXT_PUBLIC_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing — add them under" \
                 "Settings → Secrets and variables → Actions, then approve the video again."
            exit 1
          fi
          # Not fatal: the script reports progress by callback when this is set
          # and writes to the database directly when it is not. Worth saying out
          # loud, though, since without it the dashboard only updates at the end.
          if [ -z "$PUBLISH_CALLBACK_SECRET" ]; then
            echo "::warning::PUBLISH_CALLBACK_SECRET is not set, so this run cannot report" \
                 "progress back to the dashboard. Rendering will still work."
          fi
          echo "Rendering $VIDEO_ID; the required secrets are present."

      - name: Check out the repository
        uses: actions/checkout@v4

      # 22, not 20: supabase-js reaches for a global WebSocket the moment a
      # client is constructed, and Node 20 has none — createClient throws
      # before a single query is sent.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The narration is Telugu and the runner ships DejaVu, which has no
      # Indic glyphs whatsoever. Without this the captions burn in as a row of
      # empty boxes, and nothing in the render fails to say so.
      - name: Install the Telugu caption font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-telugu fontconfig
          fc-cache -f
          fc-list | grep -i telugu | head -n 5

      - name: Confirm FFmpeg is available
        run: |
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Render and upload to YouTube
        env:
          VIDEO_ID: ${{ github.event.client_payload.video_id || inputs.video_id }}
          CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Optional, and unset until the service key is rotated — but it must
          # match the deployment once it exists. The settings key is derived
          # from it when present, so a runner without it would decrypt every
          # stored credential to null and report YouTube as disconnected.
          SETTINGS_MASTER_KEY: ${{ secrets.SETTINGS_MASTER_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: ${{ vars.YOUTUBE_PRIVACY_STATUS || 'public' }}
          YOUTUBE_CATEGORY_ID: ${{ vars.YOUTUBE_CATEGORY_ID || '22' }}
          PUBLISH_CALLBACK_SECRET: ${{ secrets.PUBLISH_CALLBACK_SECRET }}
        run: npx tsx scripts/render-and-publish.ts --id="$VIDEO_ID"

      - name: Keep the rendered file for inspection when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: render-debug-${{ github.event.client_payload.video_id || inputs.video_id }}
          path: tmp-render/
          retention-days: 3
          if-no-files-found: ignore
