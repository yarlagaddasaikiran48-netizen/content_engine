name: Publish to YouTube

# Fired by the Post button, via repository_dispatch, once a rendered video has
# been watched and approved.
#
# Kept separate from the render workflow on purpose. Rendering produces a file
# and stops; this takes that exact file — the one that was reviewed, not a
# re-render that might differ — and puts it on the channel. That separation is
# the whole reason a preview is possible.
on:
  repository_dispatch:
    types: [publish-video]
  workflow_dispatch:
    inputs:
      video_id:
        description: "spiritual_videos.id to publish (must be status 'ready')"
        required: true
        type: string

# Never publish the same item twice concurrently. A duplicate upload cannot be
# undone from here — it becomes a second video on the channel.
concurrency:
  group: publish-${{ github.event.client_payload.video_id || inputs.video_id }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Same guard as the render workflow, for the same reason: a runner
      # missing these fails one second in with nothing but "exit code 1", and
      # the row sits on "publishing" with no explanation anywhere the operator
      # can see.
      - name: Check the required secrets are set
        env:
          VIDEO_ID: ${{ github.event.client_payload.video_id || inputs.video_id }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUBLISH_CALLBACK_SECRET: ${{ secrets.PUBLISH_CALLBACK_SECRET }}
        run: |
          if [ -z "$VIDEO_ID" ]; then
            echo "::error::No video_id was dispatched, so there is nothing to publish."
            exit 1
          fi
          missing=""
          for name in NEXT_PUBLIC_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing — add them under" \
                 "Settings → Secrets and variables → Actions, then press Post again."
            exit 1
          fi
          # Not fatal — the script falls back to writing the result directly.
          if [ -z "$PUBLISH_CALLBACK_SECRET" ]; then
            echo "::warning::PUBLISH_CALLBACK_SECRET is not set, so this run cannot report" \
                 "progress back to the dashboard. Publishing will still work."
          fi
          echo "Publishing $VIDEO_ID; the required secrets are present."

      - name: Check out the repository
        uses: actions/checkout@v4

      # 22, not 20: supabase-js reaches for a global WebSocket the moment a
      # client is constructed, and Node 20 has none — createClient throws
      # before a single query is sent.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Upload to YouTube, then archive and delete
        env:
          VIDEO_ID: ${{ github.event.client_payload.video_id || inputs.video_id }}
          CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
          # YouTube credentials are read from the settings table, not from
          # here: the Connect YouTube button writes the refresh token to the
          # database, so these two secrets are all the runner needs.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Must match the deployment once it is set: the settings key is
          # derived from it, and a mismatch decrypts every credential to null.
          SETTINGS_MASTER_KEY: ${{ secrets.SETTINGS_MASTER_KEY }}
          PUBLISH_CALLBACK_SECRET: ${{ secrets.PUBLISH_CALLBACK_SECRET }}
        run: npx tsx scripts/publish-video.ts --id="$VIDEO_ID" --callback-url="$CALLBACK_URL"
