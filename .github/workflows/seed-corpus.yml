name: Seed the topic corpus

# Reads the published Purana translations and writes every canto into
# topic_ledger, so the pool is limited by what the books contain rather than by
# what somebody typed into a file.
#
# Run from the Actions tab — including from a phone, which is the point. This
# is a long job that makes a couple of thousand requests to somebody else's
# server, so it is never automatic and never on a schedule.
on:
  workflow_dispatch:
    inputs:
      chapters:
        description: "Read the Purana chapters — the long one"
        required: true
        type: boolean
        default: true
      gita:
        description: "Also re-fetch the 700 Gita verses (skip if they are already in)"
        required: true
        type: boolean
        default: false
      puranas:
        description: "Comma-separated keys to limit to, e.g. linga,markandeya. Blank = all eighteen."
        required: false
        type: string
        default: ""
      per_purana:
        description: "Most chapters to take from each Purana"
        required: true
        type: string
        default: "500"

concurrency:
  group: seed-corpus
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    # Padma alone has close to seven hundred chapters, fetched one at a time.
    timeout-minutes: 300

    steps:
      - name: Check the required secrets are set
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=""
          for name in NEXT_PUBLIC_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing — add them under" \
                 "Settings → Secrets and variables → Actions, then run this again."
            exit 1
          fi
          echo "Seeding; the required secrets are present."

      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The stages are separate steps on purpose. Job logs need admin rights on
      # the repository, but every step's own pass or fail is public — so when
      # this breaks, the name of the red step says where, with no log to read.
      - name: Check the toolchain and both sources are reachable
        run: |
          node --version
          npx tsx --version
          for url in https://vedicscriptures.github.io/chapters \
                     https://www.wisdomlib.org/hinduism/book/the-linga-purana; do
            code=$(curl -s -o /dev/null -L -A "Mozilla/5.0" -w "%{http_code}" --max-time 30 "$url" || echo "000")
            echo "$code  $url"
            if [ "$code" != "200" ]; then
              echo "::error::$url is unreachable from this runner (HTTP $code)."
              exit 1
            fi
          done

      # Both workflows that write to Supabase have never once succeeded, and
      # both read the same two secrets. This asks the database one harmless
      # question and prints the status code, which separates "wrong URL" from
      # "wrong key" from "no such table" without exposing either secret.
      - name: Ask Supabase whether the credentials work
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          base="${NEXT_PUBLIC_SUPABASE_URL%/}"
          case "$base" in
            https://*.supabase.co) echo "URL shape looks right." ;;
            *) echo "::error::NEXT_PUBLIC_SUPABASE_URL should look like" \
                    "https://<project>.supabase.co with no trailing slash or path."
               echo "It is ${#base} characters long and starts with $(printf '%.8s' "$base")."
               exit 1 ;;
          esac

          key_len=${#SUPABASE_SERVICE_ROLE_KEY}
          echo "Service key is $key_len characters."
          if [ "$key_len" -lt 100 ]; then
            echo "::error::That is far too short for a service_role key. It is a JWT and" \
                 "runs to a few hundred characters — check the whole value was pasted."
            exit 1
          fi

          code=$(curl -s -o /tmp/probe.json -w "%{http_code}" --max-time 30 \
            "$base/rest/v1/topic_ledger?select=topic_key&limit=1" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")
          echo "GET /rest/v1/topic_ledger -> HTTP $code"
          head -c 400 /tmp/probe.json || true
          echo

          case "$code" in
            200) echo "Credentials work and topic_ledger is readable." ;;
            401|403) echo "::error::Supabase rejected the key (HTTP $code). SUPABASE_SERVICE_ROLE_KEY" \
                          "must be the service_role key from Project Settings → API keys, not the anon key." ; exit 1 ;;
            404) echo "::error::No topic_ledger table at that project (HTTP 404). Either the URL points" \
                      "at the wrong project, or supabase/schema.sql was never run in the SQL editor." ; exit 1 ;;
            000) echo "::error::Could not reach $base at all. Check the project URL." ; exit 1 ;;
            *) echo "::error::Unexpected HTTP $code from Supabase." ; exit 1 ;;
          esac

      - name: Write the curated topics
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/seed-topics.ts --gita=false --curated=true --chapters=false

      - name: Fetch the Gita verses
        if: ${{ inputs.gita }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/seed-topics.ts --gita=true --curated=false --chapters=false

      - name: Read the Purana chapters
        if: ${{ inputs.chapters }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PURANAS: ${{ inputs.puranas }}
          PER_PURANA: ${{ inputs.per_purana }}
        run: npx tsx scripts/seed-topics.ts --gita=false --curated=false --chapters=true
