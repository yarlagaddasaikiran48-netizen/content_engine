name: Daily script generation

# A free backup for the Vercel cron in vercel.json. Vercel's Hobby plan allows
# a limited number of cron jobs, so if you would rather not spend one on this,
# delete the "crons" block from vercel.json and let this workflow drive it.
#
# Requires two repository secrets:
#   SITE_URL     e.g. https://your-app.vercel.app
#   CRON_SECRET  the same value as the CRON_SECRET env var on Vercel
on:
  schedule:
    # 01:30 UTC = 07:00 IST
    - cron: "30 1 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ask the deployment to generate today's script
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL secret is not set; nothing to call."
            exit 1
          fi

          status=$(curl -sS -o response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            --max-time 120 \
            "${SITE_URL}/api/cron/generate")

          echo "HTTP $status"
          cat response.json
          echo

          if [ "$status" != "200" ]; then
            exit 1
          fi
